<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户登录</title>
    <style>
      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f3f4f6;
        margin: 0;
      }
      .login-card {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 350px;
      }
      h2 {
        text-align: center;
        color: #1f2937;
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 0;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #165dff;
        box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.2);
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #165dff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        font-weight: 600;
        font-size: 15px;
        transition: background-color 0.2s;
      }
      button:hover {
        background-color: #0e4bc5;
      }
      .links {
        margin-top: 20px;
        text-align: center;
        font-size: 0.875rem;
        color: #6b7280;
      }
      a {
        color: #165dff;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
      }

      /* 消息样式 */
      .alert {
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 0.875rem;
        border: 1px solid transparent;
      }

      /* 成功（绿色） */
      .alert-success {
        background-color: #ecfdf5;
        color: #047857;
        border-color: #a7f3d0;
      }

      /* 错误（红色） */
      .alert-error {
        background-color: #fef2f2;
        color: #b91c1c;
        border-color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>欢迎回来</h2>

      <!-- 消息显示区 -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="post">
        <div class="form-group">
          <input
            type="text"
            name="username"
            placeholder="请输入用户名"
            required
          />
        </div>
        <div class="form-group">
          <input
            type="password"
            name="password"
            placeholder="请输入密码"
            required
          />
        </div>
        <button type="submit">立即登录</button>
      </form>

      <div class="links">
        <p style="margin: 0 0 10px 0">
          还没有账号？ <a href="/register">立即注册</a>
        </p>
        <a href="/" style="color: #9ca3af; font-size: 0.8rem">← 返回首页</a>
      </div>
    </div>
  </body>
</html>
