<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#165DFF",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="flex flex-col justify-center items-center h-screen bg-gray-100 font-sans m-0">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-[350px]">
      <h2 class="text-center text-gray-800 mt-0 mb-6 font-semibold text-2xl">欢迎回来</h2>

      <!-- 消息显示区 -->
      {% with messages = get_flashed_messages(with_categories=true) %} 
        {% if messages %} 
          {% for category, message in messages %}
            <div class="p-2.5 rounded-lg mb-4 text-center text-sm border {{ 'bg-green-50 text-green-700 border-green-200' if category == 'success' else 'bg-red-50 text-red-700 border-red-200' }}">
              {{ message }}
            </div>
          {% endfor %} 
        {% endif %} 
      {% endwith %}

      <form method="post">
        <div class="mb-4">
          <label class="block mb-1.5 text-sm text-gray-700">
             <i class="fa fa-user mr-1 text-gray-400"></i> 用户名
          </label>
          <input
            type="text"
            name="username"
            class="w-full p-3 border border-gray-200 rounded-lg text-sm transition-colors focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            placeholder="请输入用户名"
            required
          />
        </div>
        <div class="mb-4">
          <label class="block mb-1.5 text-sm text-gray-700">
            <i class="fa fa-lock mr-1 text-gray-400"></i> 密码
          </label>
          <input
            type="password"
            name="password"
            class="w-full p-3 border border-gray-200 rounded-lg text-sm transition-colors focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            placeholder="请输入密码"
            required
          />
        </div>
        <button type="submit" class="w-full p-3 bg-primary text-white border-0 rounded-lg cursor-pointer mt-2.5 font-semibold text-[15px] transition-colors hover:bg-blue-700">立即登录</button>
      </form>

      <div class="mt-5 text-center text-sm text-gray-500">
        <p class="mb-2.5 m-0">
          还没有账号？ <a href="/register" class="text-primary no-underline font-medium hover:underline">立即注册</a>
        </p>
        <a href="/" class="text-gray-400 text-xs no-underline hover:text-gray-600">← 返回首页</a>
      </div>
    </div>
  </body>
</html>
