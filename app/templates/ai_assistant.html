<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI助手 - MEA Web 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <style>
      @keyframes blink-dot {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-2px); }
      }
      .thinking-dot {
        animation: blink-dot 1.2s infinite;
      }
      .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-dot:nth-child(3) { animation-delay: 0.3s; }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-800">
    <header class="bg-white border-b border-gray-200 shadow-sm">
      <div class="container mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-lg md:text-xl font-semibold">
          <i class="fa fa-robot text-blue-600 mr-2"></i>AI助手
        </h1>
        <a href="{{ url_for('index') }}" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">
          返回主页面
        </a>
      </div>
    </header>

    <main class="container mx-auto px-4 py-6">
      <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h2 class="text-base font-semibold">对话窗口</h2>
          <button id="clearChatBtn" class="text-xs text-gray-500 hover:text-red-600 transition-colors">
            清空对话
          </button>
        </div>

        <div id="chatBox" class="h-[62vh] overflow-y-auto bg-gray-50 p-4 space-y-3">
          <div class="text-sm text-gray-500">
            你好，我是 AI 助手。你可以连续提问，我会结合上下文回答。
          </div>
        </div>

        <form id="aiForm" class="p-4 border-t border-gray-100 bg-white">
          <div class="flex gap-3 items-end">
            <textarea
              id="prompt"
              name="prompt"
              rows="3"
              class="flex-1 rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
              placeholder="输入你的问题，Shift+Enter 换行，Enter 发送"
            ></textarea>
            <button
              id="sendBtn"
              type="submit"
              class="inline-flex items-center px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition-colors disabled:opacity-50"
            >
              <i class="fa fa-paper-plane mr-2"></i>
              发送
            </button>
          </div>
          <div id="statusText" class="mt-2 text-xs text-gray-400">等待输入</div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='ai_assistant.js') }}"></script>
  </body>
</html>
