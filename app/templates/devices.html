<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的设备控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#165DFF",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 font-sans">
    <!-- 顶部简单的导航 -->
    <nav
      class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center"
    >
      <h1 class="text-xl font-bold text-gray-800">
        <i class="fa fa-server mr-2 text-primary"></i>我的设备
      </h1>
      <a href="/" class="text-gray-500 hover:text-primary">返回首页</a>
    </nav>

    <div class="container mx-auto px-6 py-8">
      <!-- 设备网格 -->
      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        <!-- 1. “添加新设备”按钮卡片 -->
        <div
          onclick="
            document.getElementById('addDeviceModal').classList.remove('hidden')
          "
          class="bg-white border-2 border-dashed border-gray-300 rounded-xl h-48 flex flex-col items-center justify-center cursor-pointer hover:border-primary hover:bg-blue-50 transition-all group"
        >
          <div
            class="h-12 w-12 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-blue-200 transition-colors"
          >
            <i
              class="fa fa-plus text-xl text-gray-500 group-hover:text-primary"
            ></i>
          </div>
          <p class="mt-3 text-gray-500 font-medium group-hover:text-primary">
            添加新设备
          </p>
        </div>

        <!-- 2. 循环显示用户的设备 -->
        {% for device in devices %}
        <div
          class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 overflow-hidden flex flex-col h-48 relative group"
        >
          <!-- 设备状态指示灯 -->
          <!-- <div class="absolute top-4 right-4 flex items-center space-x-1">
            <span
              class="w-2 h-2 rounded-full {% if device.status == 'online' %}bg-green-500{% else %}bg-gray-400{% endif %}"
            ></span>
            <span class="text-xs text-gray-500 capitalize"
              >{{ device.status }}</span
            >
          </div> -->
          <!-- 设备状态指示灯 -->
          <div class="absolute top-4 right-4 flex items-center space-x-1">
            <!-- 圆点：加上 id="status-dot-{{ device.id }}" -->
            <span
              id="status-dot-{{ device.id }}"
              class="w-2 h-2 rounded-full transition-colors duration-300 {% if device.status == 'online' %}bg-green-500{% else %}bg-gray-400{% endif %}"
            >
            </span>

            <!-- 文字：加上 id="status-text-{{ device.id }}" -->
            <span
              id="status-text-{{ device.id }}"
              class="text-xs text-gray-500 capitalize transition-colors duration-300"
            >
              {{ device.status }}
            </span>
          </div>

          <!-- 卡片主体 (添加了 onclick 事件) -->
          <div
            class="p-6 flex-1 cursor-pointer hover:bg-gray-50 transition-colors"
            onclick="showDeviceDetail('{{ device.name }}', '{{ device.ip_address }}', '{{ device.description }}', '{{ device.api_key }}')"
          >
            <div class="flex items-center mb-4">
              <!-- 图标 -->
              <div
                class="h-10 w-10 rounded-lg bg-blue-100 flex items-center justify-center text-primary"
              >
                <i class="fa fa-microchip text-lg"></i>
              </div>
              <!-- 名字和IP -->
              <div class="ml-3">
                <h3 class="font-bold text-gray-800">{{ device.name }}</h3>
                <!-- <p class="text-xs text-gray-500 font-mono">
                  {{ device.ip_address }}
                </p> -->
              </div>
            </div>
            <!-- 描述 -->
            <p class="text-sm text-gray-400 line-clamp-2">
              {{ device.description or "暂无描述" }}
            </p>
          </div>

          <!-- 底部操作栏 -->
          <div
            class="bg-gray-50 px-4 py-3 border-t border-gray-100 flex items-center"
          >
            <!-- 1. 删除按钮 (放在最左边) -->
            <button
              class="text-gray-400 hover:text-red-500 p-2 rounded-md hover:bg-red-50 transition-colors"
              title="删除设备"
              onclick="event.stopPropagation(); confirmDelete('{{ device.id }}', '{{ device.name }}', '{{ device.ip_address }}')"
            >
              <i class="fa fa-trash"></i>
            </button>

            <!-- 这是一个弹簧，把后面的按钮挤到右边 -->
            <div class="flex-1"></div>

            <!-- 右侧按钮组 (靠右对齐，间距紧凑) -->
            <div class="flex items-center space-x-2">
              <!-- 2. 复制密钥按钮 (样式优化：白色背景+灰色边框，显得干净) -->
              <button
                class="bg-white border border-gray-400 text-gray-600 hover:text-primary hover:border-blue-300 text-xs px-3 py-1.5 rounded-lg font-medium transition-all shadow-sm flex items-center"
                title="复制 API Key"
                onclick="event.stopPropagation(); copyCardKey('{{ device.api_key }}')"
              >
                <i class="fa fa-key mr-1.5"></i> 复制密钥
              </button>

              <!-- 3. 连接按钮 (保持蓝色强调色) -->
              <a
                href="/monitor/{{ device.id }}"
                onclick="event.stopPropagation()"
                class="bg-primary hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors shadow-sm flex items-center border border-transparent"
              >
                <i class="fa fa-plug mr-1.5"></i> 连接监测
              </a>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- 添加设备的弹窗 (Modal) -->
    <div
      id="addDeviceModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all"
      >
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold">绑定新设备</h3>
          <button
            onclick="
              document.getElementById('addDeviceModal').classList.add('hidden')
            "
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>
        <form action="/add_device" method="POST">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >设备名称</label
              >
              <input
                type="text"
                name="name"
                required
                placeholder="例如：MEA-Lab-01"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-primary outline-none"
              />
            </div>
            <!-- <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >IP 地址 (模拟)</label
              >
              <input
                type="text"
                name="ip_address"
                required
                placeholder="192.168.1.100"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-primary outline-none"
              />
            </div> -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >备注信息</label
              >
              <textarea
                name="description"
                rows="3"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-primary outline-none"
              ></textarea>
            </div>
          </div>
          <div class="mt-6 flex justify-end space-x-3">
            <button
              type="button"
              onclick="
                document
                  .getElementById('addDeviceModal')
                  .classList.add('hidden')
              "
              class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg"
            >
              取消
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 font-medium"
            >
              确认添加
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 设备详情弹窗 (Detail Modal) -->
    <div
      id="deviceDetailModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all"
      >
        <!-- 标题 -->
        <div
          class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4"
        >
          <h3 class="text-xl font-bold text-gray-800">设备详情</h3>
          <button
            onclick="
              document
                .getElementById('deviceDetailModal')
                .classList.add('hidden')
            "
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>

        <!-- 内容区 -->
        <div class="space-y-5">
          <!-- 设备名称 -->
          <div>
            <label
              class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1"
              >设备名称</label
            >
            <p id="detailName" class="text-lg font-semibold text-gray-800">
              加载中...
            </p>
          </div>

          <!-- IP 地址 -->
          <!-- <div>
            <label
              class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1"
              >IP 地址</label
            >
            <div class="flex items-center">
              <i class="fa fa-globe text-gray-400 mr-2"></i>
              <p id="detailIp" class="text-gray-600 font-mono">0.0.0.0</p>
            </div>
          </div> -->

          <!-- 备注信息 -->
          <div>
            <label
              class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1"
              >备注信息</label
            >
            <p
              id="detailDesc"
              class="text-gray-600 text-sm bg-gray-50 p-3 rounded-lg border border-gray-100"
            >
              暂无备注
            </p>
          </div>

          <!-- 重点：设备密钥 (带复制) -->
          <div>
            <label
              class="block text-xs font-bold text-blue-500 uppercase tracking-wider mb-1"
              >设备密钥 (API Key)</label
            >
            <div class="flex items-center space-x-2">
              <div
                class="flex-1 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2 overflow-hidden"
              >
                <code
                  id="detailKey"
                  class="text-sm text-blue-800 font-mono break-all"
                  >加载中...</code
                >
              </div>
              <button
                id="copyKeyBtn"
                class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex-shrink-0"
              >
                <i class="fa fa-copy mr-1"></i> 复制
              </button>
            </div>
            <p class="text-xs text-gray-400 mt-2">
              <i class="fa fa-info-circle mr-1"></i> 请将此密钥填入
              <code>agent_openbci.py</code> 中的
              <code>DEVICE_TOKEN</code> 字段。
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- 【修改点】删除确认弹窗 (增加了信息展示区域) -->
    <div
      id="deleteDeviceModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all"
      >
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-red-600">
            <i class="fa fa-exclamation-triangle mr-2"></i>确认删除设备？
          </h3>
          <button
            onclick="
              document
                .getElementById('deleteDeviceModal')
                .classList.add('hidden')
            "
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>

        <form id="deleteDeviceForm" method="POST">
          <div class="space-y-4">
            <p class="text-gray-600">您确定要删除此设备吗？此操作无法撤销。</p>

            <!-- 新增：设备详情展示区 -->
            <div
              class="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm space-y-2"
            >
              <div class="flex justify-between">
                <span class="text-gray-500">设备名称:</span>
                <span id="delName" class="font-bold text-gray-800"></span>
              </div>
              <!-- <div class="flex justify-between">
                <span class="text-gray-500">IP 地址:</span>
                <span id="delIp" class="font-mono text-gray-600"></span>
              </div> -->
            </div>
          </div>

          <div class="mt-6 flex justify-end space-x-3">
            <button
              type="button"
              onclick="
                document
                  .getElementById('deleteDeviceModal')
                  .classList.add('hidden')
              "
              class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg"
            >
              取消
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium"
            >
              确认删除
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 【新增】控制删除逻辑的脚本 -->

    <!-- 悬浮窗装饰--------------------------------------------------- -->
    <!-- Toast 容器 (固定在页面顶部居中，默认隐藏) -->
    <div
      id="toast-container"
      class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none"
    >
      <div
        id="toast-message"
        class="bg-white border-l-4 border-green-500 shadow-lg rounded-md px-6 py-4 flex items-center min-w-[300px]"
      >
        <i
          id="toast-icon"
          class="fa fa-check-circle text-green-500 text-xl mr-3"
        ></i>
        <div>
          <h4 id="toast-title" class="font-bold text-gray-800 text-sm">通知</h4>
          <p id="toast-text" class="text-sm text-gray-600">操作成功</p>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // 1. Toast 消息通知逻辑
      // ==========================================
      document.addEventListener("DOMContentLoaded", function () {
        // 检查后端 Session 里有没有传过来 toast 消息
        const toastMsg = "{{ session.pop('toast_message', '') }}";
        const toastType = "{{ session.pop('toast_type', 'success') }}";

        // 如果有消息，就显示 Toast
        if (toastMsg) {
          showToast(toastMsg, toastType);
        }
      });

      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const textEl = document.getElementById("toast-text");
        const titleEl = document.getElementById("toast-title");
        const iconEl = document.getElementById("toast-icon");
        const boxEl = document.getElementById("toast-message");

        // 设置内容
        textEl.textContent = message;

        // 根据类型设置样式 (简单适配 success 和 error)
        if (type === "error") {
          titleEl.textContent = "注意！";
          boxEl.className =
            "bg-white border-l-4 border-red-500 shadow-lg rounded-md px-6 py-4 flex items-center min-w-[300px]";
          iconEl.className = "fa fa-times-circle text-red-500 text-xl mr-3";
        } else {
          titleEl.textContent = "成功！";
          boxEl.className =
            "bg-white border-l-4 border-green-500 shadow-lg rounded-md px-6 py-4 flex items-center min-w-[300px]";
          iconEl.className = "fa fa-check-circle text-green-500 text-xl mr-3";
        }

        // 显示动画 (淡入 + 下滑)
        container.classList.remove(
          "opacity-0",
          "translate-y-[-20px]",
          "pointer-events-none",
        );

        // 3秒后自动消失
        setTimeout(() => {
          container.classList.add(
            "opacity-0",
            "translate-y-[-20px]",
            "pointer-events-none",
          );
        }, 3000);
      }

      // 2. 删除确认弹窗逻辑
      // 【修改点】函数接收 3 个参数：ID, Name, IP
      function confirmDelete(id, name, ip) {
        // 1. 填充弹窗里的信息
        document.getElementById("delName").textContent = name;
        // document.getElementById("delIp").textContent = ip;

        // 2. 动态修改表单提交地址
        const form = document.getElementById("deleteDeviceForm");
        form.action = "/delete_device/" + id;

        // 3. 显示弹窗
        document.getElementById("deleteDeviceModal").classList.remove("hidden");
      }

      // 3. 设备详情弹窗逻辑 (带复制功能)
      function showDeviceDetail(name, ip, desc, apiKey) {
        // 填充详情信息
        document.getElementById("detailName").textContent = name;
        // document.getElementById("detailIp").textContent = ip;
        // 如果备注为空或 None，显示默认文字
        document.getElementById("detailDesc").textContent =
          desc && desc !== "None" ? desc : "暂无备注";
        document.getElementById("detailKey").textContent = apiKey;

        // 获取复制按钮
        const copyBtn = document.getElementById("copyKeyBtn");

        // 技巧：克隆按钮以移除旧的事件监听器 (防止多次点击导致多次绑定)
        const newBtn = copyBtn.cloneNode(true);
        copyBtn.parentNode.replaceChild(newBtn, copyBtn);

        // 绑定新的点击事件
        newBtn.onclick = function () {
          navigator.clipboard.writeText(apiKey).then(() => {
            // 复制成功后的视觉反馈 (变绿 + 对勾)
            newBtn.innerHTML = '<i class="fa fa-check mr-1"></i> 已复制';
            newBtn.className =
              "bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex-shrink-0";

            // 2秒后恢复原样
            setTimeout(() => {
              newBtn.innerHTML = '<i class="fa fa-copy mr-1"></i> 复制';
              newBtn.className =
                "bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex-shrink-0";
            }, 2000);
          });
        };

        // 显示详情弹窗
        document.getElementById("deviceDetailModal").classList.remove("hidden");
      }
      // 快速复制卡片上的密钥
      function copyCardKey(apiKey) {
        navigator.clipboard.writeText(apiKey).then(() => {
          // 复用你的 showToast 函数显示成功提示
          showToast("设备密钥已复制到剪贴板！", "success");
        });
      }
    </script>

    <script src="{{ url_for('static', filename='lib/socket.io.js') }}"></script>
    <script>
      // 1. 初始化 Socket
      document.addEventListener("DOMContentLoaded", function () {
        const socket = io();

        socket.on("device_status_change", function (msg) {
          const devId = msg.device_id;
          const devName = msg.device_name;
          const status = msg.status;
          const dot = document.getElementById(`status-dot-${devId}`);
          const text = document.getElementById(`status-text-${devId}`);

          if (dot && text) {
            // 更新文字
            text.textContent = status;

            // 强制移除旧样式，确保新样式生效
            if (status === "online") {
              dot.classList.remove("bg-gray-400"); // 删掉灰色
              dot.classList.add("bg-green-500", "animate-pulse"); // 加上绿色+动画
            } else {
              dot.classList.remove("bg-green-500", "animate-pulse"); // 删掉绿色
              dot.classList.add("bg-gray-400"); // 加上灰色
            }

            // 提示
            if (typeof showToast === "function") {
              showToast(
                `设备 #${devName} 已${status === "online" ? "上线" : "下线"}`,
                status === "online" ? "success" : "error",
              );
            }
          }
        });
      });

      // ... (后面保留你的 showToast, confirmDelete, showDeviceDetail) ...
    </script>
